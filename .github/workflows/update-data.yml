name: Update Market Data Cache

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily — a few hours after US market close, buffer for data finalization
  workflow_dispatch: {}

concurrency:
  group: update-market-data
  cancel-in-progress: false

permissions:
  contents: read  # no CSV to commit back anymore — data lives in Supabase

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-cron.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-cron.txt

      - name: Fetch, validate, and upsert data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/update_data_db.py
