name: Keep Streamlit Alive

on:
  schedule:
    # Runs every 20 minutes (at minute 0, 20, and 40 of every hour)
    - cron: '*/40 * * * *'
  workflow_dispatch: # Allows manual triggers from the GitHub Actions tab

jobs:
  ping-and-wake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install selenium

      - name: Execute Smart Ping
        run: python scripts/ping.py
