name: Keep Streamlit Alive

on:
  schedule:
    # Runs at the start of every hour to reset the timer
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual triggers from GitHub UI

jobs:
  ping-and-wake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install selenium

      - name: Execute Smart Ping
        run: python scripts/ping.py
