name: Fed Speech Embedder

on:
  workflow_run:
    workflows: ["Fed Speech Scraper"]
    types: [completed]
  workflow_dispatch: {}

concurrency:
  group: fed-speech-embedder
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  embed:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (without LFS content yet)
        uses: actions/checkout@v4
        with:
          lfs: false  # we pull LFS manually below, so we can cache it

      - name: Get LFS file hash
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@v4
        id: lfs-cache
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Git LFS pull
        run: git lfs pull

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements-embed.txt

      - name: Run embedder
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/TOOLS_automate_embed_db.py
